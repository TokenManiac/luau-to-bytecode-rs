on:
  workflow_dispatch:
  schedule:
    # every monday
    - cron: "0 0 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-luau0-src:
    name: Update luau0-src dependency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Upgrade luau0-sys in Cargo.toml
        run: cargo upgrade luau0-src

      - name: Update lockfile
        run: cargo update -p luau0-src

      - name: Check that project still builds
        run: cargo check --locked

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-luau0-src
          delete-branch: true
          title: "chore: update luau0-src"
          commit-message: "chore: update luau0-src"
          body: |
            Automated `luau0-src` dependency update.

            This runs:

            ```bash
            cargo upgrade luau0-src
            cargo update -p luau0-src
            cargo check --locked
            ```

          labels: dependencies
